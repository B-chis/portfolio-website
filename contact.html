            <body class="contact-page">

                    
                        <h2 class="contact"> Contact Me!</h2>
                            <p> If you would like to reach out to me or have any questions
                                feel free to provide your contact details below. Provide any additional information 
                                related to the contact outreach in the field as well. 
                            </p>
                    <!------
                    <div class="container">
                        ---->
                   <!---fix this row issue  
                    <div class="row">
                        --->
                        <!-----
                        <div id="contact-left" col-12 col-md-6></div>
                    -->
                        <form>
                            <label for="name">Name: </label>
                                <input type="text" placeholder="First Name" id="first-name" required>
                                <input type="text" placeholder="Last Name" id="last-name" required>
                            <br>
                            <label for="email">Email Address: </label>
                                <input type="text" placeholder="Email" id="email" required>
                            <br>
                            <label for="phonenumber">Number: </label>
                                <input type="text" placeholder="Phone Number" id="number">
                            <br>
                            <label for="address">Address: </label>
                                <input type="text" placeholder="Street name" id="street-name">
                                <input type="text" placeholder="Apartment/Building Number, etc" id="street-name-2">
                            <br>
                                <input type="text" placeholder="City, State, ZIP code" id="city-state-zip">
                            
                        </div>
                        <!-----
                        <div id="contact-right" col-12 col-md-6>
                            --->
                            <br>
                            <br>
                            <label for="reason">What's the Reason for Contact?</label>
                            <br>
                            <textarea id="reason" name="reason" rows="3%" cols="40%" required></textarea>
                        </div>
                            <section class="submission">
                                <input type="submit" value="Submit" id="submit-button">
                            </section>
                    </div>
                    </div>
                </form>
