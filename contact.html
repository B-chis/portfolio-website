            <body class="contact-page">

                    
                        <h2 class="contact"> Contact Me!</h2>
                            <p class="contact-info"> If you would like to reach out to me or have any questions,
                                feel free to provide your contact details and any additional information below. 
                            </p>
                    <!------
                    <div class="container">
                        ---->
                   <!---fix this row issue  
                    <div class="row">
                        --->
                        <!-----
                        <div id="contact-left" col-12 col-md-6></div>
                    -->
                        <form class="contact-form">
                    
                            <label for="name" class="required">Name:  </label>
                                <input type="text" placeholder="First Name" id="first-name" class="c-form" required>
                                <input type="text" placeholder="Last Name" id="last-name" class="c-form" required>
                            <br>
                            <label for="email" class="required">Email Address:  </label>
                                <input type="text" placeholder="Email Address" id="email" class="c-form" required>
                            <br>
                            <label for="phonenumber">Number: </label>
                                <input type="text" placeholder="Phone Number" class="c-form" id="number">
                            <br>
                            <label for="address">Address: </label>
                                <input type="text" placeholder="Street name" id="street-name" class="c-form">
                                <input type="text" placeholder="Apartment/Building Number, etc" id="street-name-2" class="c-form">
                            <br>
                                <input type="text" placeholder="City, State, ZIP code" id="city-state-zip" class="c-form">
                        
                        </div>
                        <!-----
                        <div id="contact-right" col-12 col-md-6>
                            --->
                            <br>
                            <br>
                            <label for="reason">Reason for contact:</label>
                            <br>
                            <textarea id="message" name="message" rows="5" cols="50" autocomplete="off" required></textarea>
                        </div>
                            <section class="submission">
                                <input type="submit" value="Submit" id="submit-button">
                            </section>
                    </div>
                    </div>
                </form>
