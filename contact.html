<!DOCTYPE html>
    <html lang="en">
        <head>
            <meta charset="UTF-8">
            <meta name="viewport" content="width=device-width, initial-scale=1.0">
            <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@4.0.0/dist/css/bootstrap.min.css" integrity="sha384-Gn5384xqQ1aoWXA+058RXPxPg6fy4IWvTNh0E263XmFcJlSAwiGgFAW/dAiS6JXm" crossorigin="anonymous">
            <link rel="stylesheet" type="text/css" href="styles.css" />
    
                <title>Contact</title>
        </head>
            <body>

                    
                        <h2 class="contact"> Contact Me!</h2>
                            <p> If you would like to reach out to me or have any additional questions
                                feel free to provide your contact details below and provide any information 
                                related to the contact outreach.
                            </p>
                    <!------
                    <div class="container">
                        ---->
                   <!---fix this row issue  
                    <div class="row">
                        --->
                        <!-----
                        <div id="contact-left" col-12 col-md-6></div>
                    -->
                        <form>
                            <label for="name">Name: </label>
                                <input type="text" placeholder="First Name" id="first-name" required>
                                <input type="text" placeholder="Last Name" id="last-name" required>
                            <br>
                            <label for="email">Email Address: </label>
                                <input type="text" placeholder="Email" id="email" required>
                            <br>
                            <label for="phonenumber">Number: </label>
                                <input type="text" placeholder="Phone Number" id="number">
                            <br>
                            <label for="address">Address: </label>
                                <input type="text" placeholder="Street name" id="street-name">
                                <input type="text" placeholder="Apartment/Building Number, etc" id="street-name-2">
                            <br>
                                <input type="text" placeholder="City, State, ZIP code" id="city-state-zip">
                            
                        </div>
                        <!-----
                        <div id="contact-right" col-12 col-md-6>
                            --->
                            <br>
                            <br>
                            <label for="reason">What's the Reason for Contact?</label>
                            <br>
                            <textarea id="reason" name="reason" rows="3%" cols="40%" required></textarea>
                        </div>
                            <section class="submission">
                                <input type="submit" value="Submit" id="submit-button">
                            </section>
                    </div>
                    </div>
                </form>
            





                <script src="java.js"></script>  
            </body>
    </html>
